  <!-- Film Holes -->
  <rect x="20" y="25" width="8" height="6" rx="1" fill="#0891b2"/>
  <rect x="20" y="42" width="8" height="6" rx="1" fill="#0891b2"/>
  <rect x="20" y="59" width="8" height="6" rx="1" fill="#0891b2"/>
  
  <rect x="72" y="25" width="8" height="6" rx="1" fill="#0891b2"/>
  <rect x="72" y="42" width="8" height="6" rx="1" fill="#0891b2"/>
  <rect x="72" y="59" width="8" height="6" rx="1" fill="#0891b2"/>
  
  <!-- Play Button -->
  <circle cx="50" cy="50" r="12" fill="#0891b2"/>
  <polygon points="47,44 47,56 57,50" fill="white"/>
</svg>

